name: Notion 數據自動清洗同步

on:
  schedule:
    - cron: '0 1 * * *'  # 每天台北時間早上 9:00 自動執行 (UTC 1:00)
  workflow_dispatch:     # 允許於 GitHub Actions 頁面手動立即觸發

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # 允許 Action 把更新後的 JSON 推回倉庫

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安裝必要套件
        run: pip install -r requirements.txt

      - name: 🧪 執行同步腳本單元測試
        run: python -m unittest discover -s tests -v

      - name: 🚀 執行數據清洗腳本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python sync_notion.py

      - name: 💾 自動推送更新回 GitHub
        run: |
          git config user.name "GitHub-Action-Bot"
          git config user.email "action@github.com"
          git add papers.json meta.json
          if git diff --staged --quiet; then
            echo "資料無變動，跳過提交與推送"
          else
            git commit -m "🤖 自動更新 Notion 數據: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
